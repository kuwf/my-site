<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 9A — English Materials</title>
<style>
  :root {
    --ink: #1f2a24;
    --paper: #f6f3ec;
    --rule: #c9c2ac;
    --accent: #3d6b52;
    --accent-soft: #e4e9df;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    line-height: 1.5;
    min-height: 100vh;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 4rem 1.5rem 5rem;
  }

  header {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 1.25rem;
    margin-bottom: 2.5rem;
  }

  .kicker {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.85rem;
    color: var(--accent);
    letter-spacing: 0.02em;
    margin: 0 0 0.4rem;
  }

  h1 {
    font-size: 2.1rem;
    margin: 0;
    font-weight: normal;
  }

  .subtitle {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.95rem;
    color: #5c6b62;
    margin-top: 0.6rem;
  }

  ul.lessons {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  ul.lessons li {
    border-bottom: 1px solid var(--rule);
  }

  ul.lessons li:first-child {
    border-top: 1px solid var(--rule);
  }

  ul.lessons a {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.3rem 0.4rem;
    text-decoration: none;
    color: var(--ink);
    transition: padding-left 0.15s ease, background 0.15s ease;
  }

  ul.lessons a:hover,
  ul.lessons a:focus-visible {
    background: var(--accent-soft);
    padding-left: 0.9rem;
  }

  .lesson-name {
    font-size: 1.25rem;
  }

  .lesson-go {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.85rem;
    color: var(--accent);
    white-space: nowrap;
  }

  footer {
    margin-top: 3.5rem;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.8rem;
    color: #8a9089;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="kicker">English &middot; Grade 9A</p>
      <h1>Lesson materials</h1>
      <p class="subtitle">Pick a lesson below to open it.</p>
    </header>

    <ul class="lessons">
      <li><a href="9A-1.html"><span class="lesson-name">9A-1</span><span class="lesson-go">Open</span></a></li>
      <li><a href="9A-2.html"><span class="lesson-name">9A-2</span><span class="lesson-go">Open</span></a></li>
      <li><a href="9A-3.html"><span class="lesson-name">9A-3</span><span class="lesson-go">Open</span></a></li>
    </ul>

    <footer>More lessons will appear here as they're added.</footer>
  </div>
</body>
</html>
